<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>미션! 여리고 가는 길</title><link rel="stylesheet" href="style.css"></head><body><div class="shell"><main class="viewport on-start" id="viewport"><div id="bg"></div><div class="tint"></div>
<div id="timePassage" class="time-passage hide" aria-hidden="true"><span id="passageBefore" class="passage-before"></span><span class="passage-after">다음 날 아침</span></div>
<header class="head"><div class="toplabel"><strong id="roleName">미션! 여리고 가는 길</strong><span id="missionName">오늘은 누구의 이야기를 시작할까?</span><span id="missionDeadline" class="deadline-note hide" role="status" aria-live="polite"></span></div><div class="topright"><div class="mark" id="stageMark">시작</div><button class="mini" id="reset" title="처음으로 (R)" aria-label="처음으로">↻</button><button class="mini" id="fullscreen" title="전체화면 (F)" aria-label="전체화면" aria-pressed="false">⛶</button></div></header>
<section id="inventory" class="inventory hide" aria-label="내 소지품">
 <div class="inventory-title">내<br>소지품</div>
 <div id="inventorySlots" class="inventory-slots" role="list"></div>
 <div id="inventoryEnergy" class="inventory-energy" role="progressbar" aria-label="기운" aria-valuemin="0" aria-valuemax="3" aria-valuenow="3"></div>
 <div id="inventoryUpdate" class="inventory-update" role="status" aria-live="polite" aria-atomic="true"></div>
</section>

<img class="actor hero hide" id="hero" alt="주인공"/><img class="actor wounded hide" id="wounded" alt="다친 나그네"/><div class="innkeeper hide" id="keeper" aria-hidden="true">👳</div><div id="loss" class="loss hide"></div>
<section class="start-panel" id="start"><div class="start-title">미션! 여리고 가는 길</div><div class="start-sub">누가복음 10장에서 출발한 가상의 이야기야. 누구로 떠나볼까?</div><p class="controls-help">역할·선택지: 1–3 · 다음: Enter / Space · 처음: R · 전체화면: F</p><div class="roles" id="roles"></div></section>
<section class="story-panel hide" id="storyPanel"><img class="portrait hide" id="portrait" alt="말하는 사람"/><div class="story-text"><div class="speaker" id="speaker"></div><div class="dialogue" id="dialogue"></div></div><button class="next" id="next">다음 ▶</button></section>
<section class="choice-panel hide" id="choicePanel"><div class="question" id="question"></div><div class="options" id="options"></div></section>
<section class="ending-panel hide" id="endingPanel"><div class="end-role" id="endRole"></div><img class="end-face hide" id="endingPortrait" alt="주인공"/><div class="end-title" id="endTitle"></div><div class="end-sub" id="endSubtitle"></div><div class="end-story" id="endStory"></div><button class="again" id="again">마지막 질문 ▶</button></section><section class="reflection-panel hide" id="reflectionPanel" aria-label="마지막 질문"><div class="reflection-question">나였다면,
어떤 이웃을 만나고 싶었을까?</div><button class="reflection-restart" id="reflectionRestart">↻ 다시 시작</button></section>
</main></div><script src="game.js?v=20261028-2"></script></body></html>
